name: release

# Build the sdist + wheel and publish to PyPI through Trusted Publishing (OIDC; no API token in
# the repository), then create the GitHub Release for the tag. Triggered by version tags (v*)
# or manually; see RELEASING.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Smoke-test the wheel
        run: |
          python -m pip install dist/*.whl
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          nefi --version && nefi list instances
          python -m pip install "typer>=0.27"
          nefi --version && nefi list instances
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Collect the release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## \[/ { if (found) exit; found = index($0, "[" v "]") > 0; next }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "See CHANGELOG.md for the changes in this release." > notes.md; fi
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: nefi ${{ github.ref_name }}
          body_path: notes.md
          files: dist/*

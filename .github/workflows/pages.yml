name: pages

# Builds the documentation site with MkDocs Material and publishes it to GitHub Pages
# (https://continuumcoder.github.io/NEFI/). Pull requests that touch the docs only build it, in
# strict mode, so broken links and missing pages fail before they reach main.
# GitHub Pages must be enabled once in the repository settings with "GitHub Actions" as the
# source; until then the deploy job cannot create a deployment.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - "LICENSE"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:                      # one deployment at a time; never cancel a running deployment
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Install the documentation toolchain
        run: python -m pip install -r docs/requirements.txt
      - name: Build the site (strict)
        run: mkdocs build --strict --site-dir site
      - name: Upload the site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

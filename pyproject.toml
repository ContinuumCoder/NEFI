[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nefi"
version = "0.1.1"
description = "Neural-field inversion: recover hidden physical fields from a single measurement with a differentiable model of the instrument and no training data"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "CAB Lab, Princeton University" }]
keywords = ["inverse problems", "neural fields", "differentiable physics", "scientific machine learning"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "torch>=2.1",
  "numpy>=1.24",
  "scipy>=1.10",
  "pyyaml>=6",
  "tqdm>=4.60",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.7"]
cli = ["typer>=0.9", "rich>=13"]
dev = [
  "pytest>=7",
  "ruff>=0.4",
  "mypy>=1.5",
  "scikit-image>=0.21",
  "matplotlib>=3.7",
  "typer>=0.9",
  "rich>=13",
]

[project.scripts]
nefi = "nefi.cli:main"

[project.urls]
Homepage = "https://github.com/ContinuumCoder/NEFI"
Documentation = "https://continuumcoder.github.io/NEFI/"
Repository = "https://github.com/ContinuumCoder/NEFI"
Issues = "https://github.com/ContinuumCoder/NEFI/issues"
Lab = "https://cablab.scholar.princeton.edu"

[tool.setuptools.packages.find]
include = ["nefi*"]

[tool.setuptools.package-data]
nefi = ["py.typed"]
"nefi.viz" = ["assets/*.js", "assets/*.css"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["B008", "B028", "B905", "UP007"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: slow tests (deselect with -m 'not slow')"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

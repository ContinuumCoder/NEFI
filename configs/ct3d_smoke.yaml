# ct3d — tiny local smoke run (CPU, ≈ 6 s on one core): 32×32×16 3-D Shepp-Logan-like volume,
# 12 parallel-beam views over 180° about z, 1 % sinogram noise, 16×16×8 → 32×32×16 curriculum with
# 150 + 250 steps. Identical to PRESETS["smoke"] of nefi.instances.ct3d; everything not listed takes
# the default of CT3DConfig (see ct3d_full.yaml).
# Usage:  python examples/ct3d.py --config configs/ct3d_smoke.yaml
#         nefi run ct3d --smoke        (the CLI additionally caps the step count)
instance: ct3d
config:
  n: 32
  n_z: 16
  n_views: 12
  scene: ellipsoids          # ellipsoids | blobs | piecewise
  hidden: 64
  depth: 3
  skip_at: 2
  n_octaves: 5
  steps: [150, 250]
  lr: 3.0e-2
  tv: 2.0e-5
  dd_width: 32
  dd_stages: 3
run:
  seed: 0
  device: auto
  methods: [neural, fbp3d, grid, deep_decoder]
  out: runs/ct3d_smoke

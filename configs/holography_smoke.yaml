# holography — tiny local smoke run (CPU, ~3-5 s): 32×32 phase map (1 μm pixels), λ = 0.5 μm,
# intensities at z = 10, 25, 50 μm (band-limited angular spectrum, edge padding); data simulated on a
# 2x finer grid in float64 and area-averaged onto the detector, 1 % noise; 16² → 32² curriculum.
# Everything not listed takes the default of nefi.instances.holography.HolographyConfig.
# Usage:  python examples/holography.py --config configs/holography_smoke.yaml
#         nefi run holography --smoke
instance: holography
config:
  n: 32
  pixel_size: 1.0            # μm
  wavelength: 0.5            # μm
  distances: [10.0, 25.0, 50.0]   # μm
  scene: smooth_phase        # smooth_phase | cells
  phase_amplitude: 1.0       # rad
  absorption: 0.0
  noise_std: 0.01
  supersample: 2
  pad_factor: 2.0
  pad_mode: edge
  hidden: 64
  depth: 4
  n_octaves: 6
  tv: 1.0e-4
  steps: [150, 250]
  lr: 1.0e-2
  gs_iterations: 100
run:
  seed: 0
  device: auto
  methods: [neural, gerchberg_saxton, grid]
  out: runs/holography_smoke

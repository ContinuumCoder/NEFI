# Darcy flow — full-scale settings for the CUDA servers.
# 64×64 grid, 8 well configurations, 12×12 gauges, two-stage curriculum 32² → 64².
# Usage (CUDA server):
#   python examples/darcy_flow.py --config configs/darcy_flow_full.yaml --device cuda
instance:
  type: darcy_flow
  # geometry & physics
  n: 64
  length: 1.0
  viscosity: 1.0
  bc: neumann                # no-flow reservoir (pure Neumann, compatibility handled)
  n_configs: 8
  well_radius: 0.3
  well_rate: 1.0
  well_angle: 0.3
  well_spread: linear
  face_mode: harmonic
  # sensors
  n_sensors: 12
  sensor_jitter: 0.0
  well_exclusion: 1.5
  # scenes (log k)
  scene: channels            # smooth | channels
  log_k_mean: 0.0
  log_k_std: 0.8
  corr_length: 0.15
  n_modes: 128
  channel_contrast: 2.5
  channel_bg_std: 0.4
  n_channels: [1, 3]
  channel_width: [0.05, 0.08]
  log_k_min: -3.0
  log_k_max: 4.0
  # data
  noise_std: 2.0e-3
  supersample: 2
  # PDE solver
  tol: 1.0e-6
  grad_mode: ift
  warm_start: true
  check_every: 8            # CG convergence check every 8 iterations (fewer host syncs)
  # neural field
  hidden: 256
  depth: 6
  skip_at: 3
  n_octaves: 4
  activation: relu
  # curriculum 32² → 64²
  multiscale: true
  steps: [1000, 3000]
  lr: 5.0e-3
  lr_decay: 0.5
  anneal_fraction: 0.5
  # losses
  tv: 1.0e-5
  grid_lr: 0.05
run:
  seed: 0
  device: auto
  methods: [neural, grid]
  out: runs/darcy_flow_full
